  scenarios: [10]
  normalization: "baseMVAnorm"
  baseMVA: 100
  mask_type: "rnd"
  mask_value: 0.0
  mask_ratio: 0.5
  mask_dim: 6
  learn_mask: False
  val_ratio: 0.1
  test_ratio: 0.1
  workers: 0
model:
  type: "GNN_TransformerConv"
  input_dim: 13
  output_dim: 6
  edge_dim: 2
  pe_dim: 20
  num_layers: 4
